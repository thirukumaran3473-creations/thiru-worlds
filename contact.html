<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Contact | My Site</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: #121212;
    color: #f5f5f5;
    font-family: Georgia, 'Times New Roman', serif;
  }
  nav {
    background: #000;
    display: flex;
    justify-content: center;
    gap: 40px;
    padding: 18px 0;
  }
  nav a {
    color: #fff;
    text-decoration: none;
    font-size: 18px;
    font-weight: bold;
  }
  nav a.active {
    color: #f0c94a;
  }
  .container {
    max-width: 500px;
    margin: 0 auto;
    padding: 30px 24px 60px;
  }
  h1 {
    text-align: center;
    font-size: 32px;
  }
  form {
    margin-top: 20px;
  }
  label {
    display: block;
    margin-bottom: 6px;
    font-size: 16px;
    color: #ddd;
  }
  input, textarea {
    width: 100%;
    padding: 12px;
    margin-bottom: 20px;
    background: #1c1c1c;
    border: 1px solid #444;
    border-radius: 6px;
    color: #fff;
    font-family: inherit;
    font-size: 15px;
  }
  textarea {
    min-height: 120px;
    resize: vertical;
  }
  button {
    width: 100%;
    padding: 14px;
    background: #f0c94a;
    color: #000;
    border: none;
    border-radius: 6px;
    font-size: 17px;
    font-weight: bold;
    cursor: pointer;
  }
  button:hover {
    background: #e0b830;
  }
  .back-link {
    display: block;
    text-align: center;
    margin-top: 24px;
    color: #b6a4f5;
  }
  .status-msg {
    text-align: center;
    margin-top: 14px;
    font-size: 15px;
    display: none;
  }
  .status-msg.success { color: #7ee787; }
  .status-msg.error { color: #ff6b6b; }
</style>
</head>
<body>

<nav>
  <a href="index.html">Home</a>
  <a href="about.html">About</a>
  <a href="contact.html" class="active">Contact</a>
  <a href="login.html">Login</a>
</nav>

<div class="container">
  <h1>📩 Contact Me 📩</h1>

  <form id="contactForm" action="https://formspree.io/f/mrpzaarq" method="POST">
    <label for="name">Name</label>
    <input type="text" id="name" name="name" placeholder="Your name" required>

    <label for="email">Email</label>
    <input type="email" id="email" name="email" placeholder="you@example.com" required>

    <label for="message">Message</label>
    <textarea id="message" name="message" placeholder="Type your message here..." required></textarea>

    <button type="submit">Send Message</button>
    <p id="statusMsg" class="status-msg"></p>
  </form>

  <a href="index.html" class="back-link">&larr; Back to Home</a>
</div>

<script>
  const form = document.getElementById('contactForm');
  const statusMsg = document.getElementById('statusMsg');

  form.addEventListener('submit', function (e) {
    e.preventDefault();
    const data = new FormData(form);

    fetch(form.action, {
      method: 'POST',
      body: data,
      headers: { 'Accept': 'application/json' }
    })
    .then(response => {
      if (response.ok) {
        statusMsg.textContent = "Message sent! I'll get back to you soon.";
        statusMsg.className = 'status-msg success';
        statusMsg.style.display = 'block';
        form.reset();
      } else {
        statusMsg.textContent = "Something went wrong. Please try again.";
        statusMsg.className = 'status-msg error';
        statusMsg.style.display = 'block';
      }
    })
    .catch(() => {
      statusMsg.textContent = "Something went wrong. Please try again.";
      statusMsg.className = 'status-msg error';
      statusMsg.style.display = 'block';
    });
  });
</script>

</body>
</html>
